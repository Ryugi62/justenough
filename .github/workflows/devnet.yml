name: Devnet (real proofs)

# Deploys the contract to a throw-away local Midnight network (node + indexer + proof server)
# and runs the full lifecycle with real ZK proofs, then re-checks the recorded evidence.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: '0.31.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      # On a cold runner the indexer can start before the node's first block and exit with
      # "Cannot construct OnlineClientAtBlock: block number 1 not found" (seen 2026-09-24); retry.
      - name: start the local network (retry the indexer's cold-start race)
        run: |
          for i in 1 2 3; do
            if npm run devnet:up; then exit 0; fi
            echo "::warning::devnet:up attempt $i failed"
            docker compose -f devnet/compose.yml ps -a || true
            docker compose -f devnet/compose.yml logs --no-color --tail 80 indexer || true
            docker compose -f devnet/compose.yml down || true
            sleep 15
          done
          exit 1
      # The genesis DUST is valued at the latest indexed block's timestamp, so while the indexer is
      # still at block 0 every fee balance fails with "Insufficient Funds: could not balance dust"
      # (midnightntwrk/midnight-faucet-api#88; seen here twice on 2026-09-25). Wait until it is past
      # genesis, and retry the walk (3 tries) while DUST is still short.
      - name: wait until the indexer is past genesis
        run: |
          for i in $(seq 1 90); do
            h=$(curl -s -X POST -H 'content-type: application/json' \
              --data '{"query":"{ block { height } }"}' http://127.0.0.1:8088/api/v4/graphql \
              | jq -r '.data.block.height // 0' 2>/dev/null || echo 0)
            echo "indexer height ${h:-0}"
            if [ "${h:-0}" -ge 2 ]; then exit 0; fi
            sleep 2
          done
          echo "::error::indexer stayed at genesis for 180 s"
          exit 1
      - name: full lifecycle with real proofs
        shell: bash
        run: |
          mkdir -p logs
          for i in 1 2 3; do
            set +e
            npm run devnet:e2e 2>&1 | tee logs/devnet-e2e.log
            code=${PIPESTATUS[0]}
            set -e
            if [ "$code" = 0 ]; then exit 0; fi
            grep -q 'Insufficient Funds' logs/devnet-e2e.log || exit "$code"
            echo "::warning::devnet:e2e attempt $i: DUST not generated yet, waiting 20 s"
            sleep 20
          done
          exit 1
      - run: npx vitest run tests/docs/devnet-evidence.test.ts
      - name: container logs on failure
        if: failure()
        run: |
          mkdir -p logs
          docker compose -f devnet/compose.yml ps -a > logs/compose-ps.log 2>&1 || true
          docker compose -f devnet/compose.yml logs --no-color > logs/compose.log 2>&1 || true
          tail -n 120 logs/compose.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-run
          path: |
            docs/devnet-run.json
            logs/compose*.log
            logs/devnet-e2e.log
      - if: always()
        run: npm run devnet:down
